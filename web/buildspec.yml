# AWS CodeBuild: build the web image, push it to ECR, and roll the ECS service.
#
# The deploy happens here rather than in a CodePipeline ECS action because that
# action calls UpdateService, which does not apply to Express Gateway services —
# those have their own UpdateExpressGatewayService API.

version: 0.2

env:
  variables:
    IMAGE_REPO: nnneva-web
    IMAGE_TAG: latest
    SERVICE_ARN: ""

phases:
  pre_build:
    commands:
      - REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      # CodeBuild's bundled boto3 predates Express Mode, so pin a version that
      # knows the API rather than relying on the image.
      - pip install --quiet --upgrade "boto3>=1.40"

  build:
    commands:
      # Fargate is x86_64; an arm64 image fails as a health-check failure that
      # never mentions architecture.
      - docker build --platform linux/amd64 -t "$IMAGE_REPO:$IMAGE_TAG" web

  post_build:
    commands:
      - REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - docker tag "$IMAGE_REPO:$IMAGE_TAG" "$REGISTRY/$IMAGE_REPO:$IMAGE_TAG"
      - docker push "$REGISTRY/$IMAGE_REPO:$IMAGE_TAG"
      - |
        if [ -n "$SERVICE_ARN" ]; then
          IMAGE="$REGISTRY/$IMAGE_REPO:$IMAGE_TAG" SERVICE_ARN="$SERVICE_ARN" python3 - <<'PY'
        import os, boto3
        ecs = boto3.client("ecs")
        arn = os.environ["SERVICE_ARN"]
        current = ecs.describe_express_gateway_service(serviceArn=arn)["service"]
        container = dict(current["activeConfigurations"][0]["primaryContainer"])
        # Only the image changes; environment and secrets are carried forward so
        # a deploy never silently drops configuration set outside this pipeline.
        container["image"] = os.environ["IMAGE"]
        container.pop("awsLogsConfiguration", None)
        ecs.update_express_gateway_service(serviceArn=arn, primaryContainer=container)
        print("Rolled", arn, "to", container["image"])
        PY
        else
          echo "SERVICE_ARN unset; image pushed but no service rolled."
        fi
